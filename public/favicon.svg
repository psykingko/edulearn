<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="edulearn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2855D9" />
      <stop offset="50%" stop-color="#7951C8" />
      <stop offset="100%" stop-color="#C04BAA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#7951C8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded square with brand gradient -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#edulearn-grad)" />

  <!-- Subtle inner border highlight -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />

  <!-- Geometric "E" Brand Mark -->
  <path d="M9 8.5 H23 V12.5 H13.5 V14.5 H21 V18 H13.5 V20 H23 V24 H9 Z" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Top-Right Accent Spark -->
  <circle cx="23" cy="8.5" r="2" fill="#38BDF8" />
</svg>
